<div>
  <h2>Connect With Us</h2>
  <p>May tanong? Mag-message sa amin sa Facebook o Messenger, o bisitahin kami!</p>

  <div style="margin-top:24px;padding:20px;background:linear-gradient(135deg,rgba(255,255,255,0.04),rgba(255,255,255,0.01));border-radius:14px;border-left:4px solid var(--accent)">
    <h3 style="margin-top:0">Quick Message</h3>
    <div class="social-links">
      <a href="https://www.facebook.com/share/1EPZrefPY9/" target="_blank" class="social-btn" title="Facebook">f</a>
      <a href="https://www.facebook.com/share/1EPZrefPY9/" target="_blank" class="social-btn" title="Messenger">💬</a>
    </div>
  </div>

  <h3 style="margin-top:28px">Or Email Us</h3>
  <form class="contact-form" onsubmit="event.preventDefault(); alert('Salamat! Ipapadala ang mensahe.');">
    <div class="form-group">
      <label for="name">Pangalan</label>
      <input type="text" id="name" placeholder="Your name" />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="your@email.com" />
    </div>
    <div class="form-group">
      <label for="message">Mensahe</label>
      <textarea id="message" placeholder="Tell us your thoughts..."></textarea>
    </div>
    <button type="submit" class="button-primary">Send</button>
  </form>
</div>
