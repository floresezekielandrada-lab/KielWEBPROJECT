<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#221815" rx="32" />
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(50,50)">
    <rect x="0" y="0" width="700" height="500" rx="18" fill="rgba(255,255,255,0.02)" />
    <image href="images/kapesalakbay-logo.jpg" x="140" y="40" width="420" height="420" preserveAspectRatio="xMidYMid meet" style="filter:url(#soft)" />
  </g>
</svg>
